# Builds the Docker image, tests it as it would be deployed, scans it for known vulnerabilities, and (for a version tag like v1.2.3)
# publishes it to the GitHub Container Registry as ONE multi-platform image (linux/amd64 and linux/arm64), then creates a GitHub release.
#
# Each architecture is built, tested and scanned on a runner of its own architecture (no emulation): amd64 on ubuntu-24.04 and arm64 on
# ubuntu-24.04-arm (free and unlimited for public repositories). For a tag, each architecture's image is pushed by digest, and a final job
# merges the two into the tags 1.2.3, 1.2 and latest. Users just pull the tag: Docker picks the image that matches their machine.
#
# To release:  set "version" in package.json, commit, then   git tag v1.2.3 && git push origin v1.2.3
#
# It also runs every Monday on a schedule: base images and their packages get security fixes all the time, so a weekly rebuild + scan
# tells the owner (by a failed run) when the image needs a rebuild even though no code changed.
name: Docker

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - docker/**
      - package.json
      - server.js
      - lib/**
      - public/**
      - builtin-plugins/**
      - config/**
      - scripts/**
      - .github/workflows/docker.yml
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

# Least privilege by default; the publish job asks for more, and only it.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: adaptive-photo-frame
  # The vulnerability scanner runs from its official image, pinned by version AND content digest (so a re-pushed tag cannot change it).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  build-test-scan:
    name: Build, test and scan (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # The smoke test script uses the app's own packages (sharp) to make sample photos.
      - name: Install the app's packages
        run: if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The values stamped into the image labels (version, revision, created, source). The repository address comes from GitHub.
      - name: Work out the values to stamp into the image
        id: stamp
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "version=$(node -p "require('./package.json').version")"
            echo "revision=${GITHUB_SHA::7}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"

      - name: Build the image (loaded into the local Docker for testing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false # attestations cannot be loaded into the local Docker; the publish job adds them
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: |
            APF_VERSION=${{ steps.stamp.outputs.version }}
            APF_REVISION=${{ steps.stamp.outputs.revision }}
            APF_CREATED=${{ steps.stamp.outputs.created }}
            APF_SOURCE=${{ steps.stamp.outputs.source }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # Starts the image with the hardened settings and checks non-root, a shell and npm, first run, labels, health, shutdown, and that it serves photos.
      - name: Smoke test the image
        run: node docker/dockerSmokeTest.js "$IMAGE_NAME:ci"

      # Fails the run on any HIGH or CRITICAL vulnerability that has a fix available. Scans a saved copy of the image, so the scanner
      # never gets access to the Docker socket.
      - name: Scan the image for known vulnerabilities
        run: |
          docker save "$IMAGE_NAME:ci" -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" "$TRIVY_IMAGE" image \
            --input /image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress

  publish:
    name: Publish linux/${{ matrix.arch }} to GHCR
    # Only for a version tag, and only after both architectures passed every check above.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-test-scan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag must match the version in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG but package.json says version $version. Fix one of them and tag again."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name and the values to stamp into the image
        id: stamp
        env:
          REPO: ${{ github.repository }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "image=ghcr.io/${REPO,,}" # registry names must be lower case
            echo "version=$(node -p "require('./package.json').version")"
            echo "revision=${GITHUB_SHA::7}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"

      # Pushed by digest, with no tag: the final job gives both architectures their shared tags. The layers come from the cache of the
      # build above, so this is the image that was tested, plus the provenance and SBOM attestations.
      - name: Build and push this architecture by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.stamp.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APF_VERSION=${{ steps.stamp.outputs.version }}
            APF_REVISION=${{ steps.stamp.outputs.revision }}
            APF_CREATED=${{ steps.stamp.outputs.created }}
            APF_SOURCE=${{ steps.stamp.outputs.source }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # Hands the digest to the final job: an empty file named after it.
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Merge the architectures into one image and create the release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # create the GitHub release
      packages: write  # push the merged tags to ghcr.io
    env:
      # Makes the metadata step describe the merged image (an "index"), not a single architecture's image.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the repository name for the image name and creates the tags: 1.2.3, 1.2 and latest.
      - name: Work out the image name, tags and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # One tag that points at both architectures' images. The annotations (source, url, created...) are what GitHub reads to link the
      # package to this repository.
      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r note; do args+=(--annotation "$note"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          image="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | cut -d: -f1)"
          sources=()
          for digest in *; do sources+=("$image@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Show the result (the platforms in the image)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: docker buildx imagetools inspect "${IMAGE,,}:$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as it is."
          else
            image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
            gh release create "$TAG" --verify-tag --generate-notes \
              --notes "Container image: \`${image}:${TAG#v}\` (linux/amd64 and linux/arm64; Docker picks the right one). Run it as described in the README, section \"Run with Docker\"."
          fi
