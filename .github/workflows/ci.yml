# Runs the unit tests on every push and pull request.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # `npm ci` installs exactly what the lock file says. Without a committed lock file it falls back to `npm install`.
      - name: Install the app's packages
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install each plugin's own packages
        run: npm run install-plugins

      - name: Run the tests
        run: npm test
